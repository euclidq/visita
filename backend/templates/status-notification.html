<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Status Update</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f3f4f6" bgcolor="#f3f4f6">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f4f6" style="width: 100%; background-color: #f3f4f6">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width: 100%; max-width: 560px; overflow: hidden; border-radius: 12px; background-color: #ffffff">
            <tr>
              <td align="center" bgcolor="#3b82f6" style="padding: 24px 32px; background-color: #3b82f6">
                <img src="cid:{{logoCid}}" alt="Visita" width="180" style="display: block; width: 180px; max-width: 100%; height: auto; margin: 0 auto" />
              </td>
            </tr>
            <tr>
              <td align="center" bgcolor="#ffffff" style="padding: 32px; background-color: #ffffff; color: #111827; font-family: Arial, sans-serif; text-align: center">
                <h1 style="margin: 0 0 12px; font-size: 24px">{{heading}}</h1>
                <p style="margin: 0 0 24px; color: #4b5563">{{subtitle}}</p>
                <div style="margin-top: 16px"><span style="display: block; margin-bottom: 4px; color: #4b5563">Reference number</span><strong style="display: block; font-size: 18px">{{referenceNumber}}</strong></div>
                <div style="margin-top: 16px"><span style="display: block; margin-bottom: 4px; color: #4b5563">Visitor name</span><strong style="display: block; font-size: 18px">{{visitorName}}</strong></div>
                {{rejectionReasonSection}}
                {{qrCodeSection}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
