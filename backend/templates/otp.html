<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your verification code</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f3f4f6;
        color: #111827;
        font-family: Arial, sans-serif;
      }

      .email-shell {
        padding: 32px 16px;
      }

      .otp-card {
        max-width: 560px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 12px;
        background-color: #ffffff;
      }

      .brand-header {
        padding: 24px 32px;
        border-bottom: 1px solid #dbeafe;
        background-color: #eff6ff;
        text-align: center;
      }

      .brand-logo {
        display: block;
        width: 180px;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      .otp-content {
        padding: 32px;
        text-align: center;
      }

      .otp-title {
        margin: 0 0 12px;
        font-size: 24px;
      }

      .otp-message,
      .expiry-message {
        color: #4b5563;
      }

      .otp-message {
        margin: 0 0 24px;
      }

      .otp-code {
        margin: 0 0 24px;
        font-size: 32px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 8px;
      }

      .expiry-message {
        margin: 0;
      }

      @media (max-width: 600px) {
        .email-shell {
          padding: 16px 8px;
        }

        .brand-header,
        .otp-content {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="email-shell">
      <article class="otp-card" aria-labelledby="otp-title">
        <header class="brand-header">
          <img class="brand-logo" src="cid:{{logoCid}}" alt="Visita" width="180" />
        </header>
        <section class="otp-content">
          <h1 id="otp-title" class="otp-title">Verify your email</h1>
          <p class="otp-message">Enter this verification code to continue:</p>
          <p class="otp-code">{{otp}}</p>
          <p class="expiry-message">This code expires in {{expiryMinutes}} minutes.</p>
        </section>
      </article>
    </main>
  </body>
</html>
